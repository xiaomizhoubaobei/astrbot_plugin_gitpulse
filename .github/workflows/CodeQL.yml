name: "代码质量分析"

on:
  push:
    branches: [ "main" ]
    paths:
      - '**.py'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**.py'
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  # 最小权限：无 OIDC 联邦/云身份需求，**不授予** id-token: write——
  # 否则一旦某个 action 被替换，攻击者可凭空铸造云身份令牌（多余武器）。
  contents: read
  actions: read

jobs:
  analyze:
    name: 分析（${{ matrix.language }} @ ${{ matrix.os }} / Python ${{ matrix.python-version }}）
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      contents: read
      # 仅上传 CodeQL 结果需要 security-events: write；同样不需要 id-token。
      security-events: write

    strategy:
      fail-fast: false
      # CodeQL 的 Python 查询结果与**操作系统 / Python 版本基本无关**（它做的是
      # 源码级数据流分析，不做跨版本运行时覆盖）。此前用 os × python-version 的
      # 组合矩阵（5 个组合）只会把同一份分析重复跑 5 次、各自上传一个 category，
      # 徒增 CI 成本而**不增加分析覆盖**。故收敛为**单一运行器 + 单一版本**；
      # 若确需验证多环境运行时行为，请另建独立的测试矩阵，而非塞进 CodeQL。
      matrix:
        language: [ 'python' ]
        os: [ 'ubuntu-latest' ]
        # 单版本工作流，与测试矩阵（coverage.yml）的起始版本对齐到 3.12。
        # ⚠️ 本仓库声明 Python 3.12+（见 .pre-commit-config.yaml 的 --target-version py312），
        #    故此处**不得**照搬上游模板的 3.13；升版本时与 coverage.yml 矩阵同源修改。
        python-version: [ '3.12' ]

    steps:
    - name: 加固运行器（审计所有出站调用）
      # 观察模式：egress-policy 保持 audit，仅记录出网调用、不阻断构建。
      # 曾短暂切换为 block + 白名单，因阻断模式下任何未覆盖端点都会直接
      # 让步骤失败（如 setup-python 回退拉取 versions-manifest.json），
      # 故按仓库统一策略回退为观察模式；后续如需收紧，先凭审计日志收敛白名单。
      uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
      with:
        egress-policy: audit

    - name: 检出仓库
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: 设置 Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    # ⚠️ 手工构建（而非 autobuild）：本仓库是「插件根 main.py + src/ 源码包」布局，
    #    模块导入路径依赖运行时的 sys.path 注入（见 main.py），autobuild 仅做
    #    「能装就装、能导入就导入」的启发式探测，探测失败会静默降级为
    #    「提取到 0 个源文件」——CodeQL 仍绿，但**一个告警都不会产出**，
    #    属于「看起来在扫、实际没扫」的假安全。故显式声明依赖安装与构建命令。
    - name: 初始化 CodeQL
      uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        languages: ${{ matrix.language }}
        # 源码在 src/，tests/ 与 ai-audit/（AI 审计示例）不属交付代码，排除以减少噪音。
        config: |
          paths-ignore:
            - tests
            - ai-audit
            - docs
            - templates

    # CodeQL 的 Python 提取需要能被导入的源码上下文：装上运行依赖，
    # 让 `src/**` 的跨文件数据流（aiohttp 处理器 → 工具函数）能被完整追踪。
    - name: 安装依赖（供 CodeQL 提取）
      run: |
        python -m pip install --upgrade pip
        # 本仓库依赖清单位于 src/requirements.txt（AstrBot 宿主由 AstrBot 运行时提供，
        # 静态分析不需要导入宿主，故不在此安装，避免拉取无关的重依赖）。
        pip install -r src/requirements.txt

    - name: 构建（语法自检，为提取准备干净的环境）
      run: |
        # Python 无需编译：显式跑一遍字节码编译，能在提取前就暴露语法错误
        # （语法错会让 CodeQL 静默少提取文件，表现为告警数量莫名变少）。
        python -m compileall -q src main.py

    - name: 执行 CodeQL 分析
      uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        # 单一组合下 category 只需按语言区分；保留语言维度便于未来扩展多语言
        category: "/language:${{ matrix.language }}"
