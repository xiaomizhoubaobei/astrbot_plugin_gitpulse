name: 'Release 构建'

# 触发条件：推送到 main 分支时触发或手动触发
on:
  push:
    branches:
      - main
    paths:
      - '**/*.py'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  build:
    name: 构建 Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # 为签名所必需
      actions: read

    steps:
      # 0. 安全加固
      - name: 加固运行器
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # 1. 检出代码
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # 获取完整的 git 历史

      # 2. 设置 Python 环境
      - name: 设置 Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # 3. 获取版本号和插件名称（严格白名单校验，杜绝命令注入）
      - name: 获取版本号和插件名称
        id: get_info
        env:
          # metadata.yaml 随 PR 提交，属不可信输入；此处只做提取，随后立即用白名单校验。
          META_FILE: metadata.yaml
        run: |
          set -euo pipefail

          # 从 metadata.yaml 读取版本号（仅取 key 后的第一个字段，剥离行尾注释/空白）
          VERSION=$(grep -E "^version:[[:space:]]*" "$META_FILE" | head -n 1 | sed -E 's/^version:[[:space:]]*//; s/[[:space:]]+.*$//')
          # 移除可能存在的 'v' 前缀以避免重复
          VERSION=${VERSION#v}

          # 从 metadata.yaml 读取插件名称（同上处理）
          PLUGIN_NAME=$(grep -E "^name:[[:space:]]*" "$META_FILE" | head -n 1 | sed -E 's/^name:[[:space:]]*//; s/[[:space:]]+.*$//')

          # ── 白名单严格校验 ──────────────────────────────────────────────
          # 这两个值后续会用于 mkdir / zip / Release 资源名等位置；metadata.yaml
          # 属于不可信输入，任何 shell 元字符（$ ` ; | & ( ) 空格 换行等）都
          # 必须在源头拒绝，否则会在 contents: write 的发布作业中造成命令注入。
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::metadata.yaml 中的 version 非法（仅允许 SemVer，例如 1.2.3）：'${VERSION}'"
            exit 1
          fi
          if ! printf '%s' "$PLUGIN_NAME" | grep -Eq '^[A-Za-z0-9._-]{1,64}$'; then
            echo "::error::metadata.yaml 中的 name 非法（仅允许字母/数字/._-，且不超过 64 字符）：'${PLUGIN_NAME}'"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "plugin_name=$PLUGIN_NAME" >> "$GITHUB_OUTPUT"

      # 4. 安装依赖
      - name: 安装依赖
        run: |
          # 本仓库依赖清单位于 src/requirements.txt（插件生态依赖由 AstrBot 宿主提供）
          if [ -f src/requirements.txt ] && [ -s src/requirements.txt ]; then
            pip install -r src/requirements.txt
          else
            echo "src/requirements.txt 不存在或为空，跳过依赖安装"
          fi

      # 5. 创建插件目录（plugin_name 经 env 传入，禁止直接内插进 run）
      - name: 创建插件目录
        env:
          PLUGIN_NAME: ${{ steps.get_info.outputs.plugin_name }}
        run: |
          mkdir -p "$PLUGIN_NAME"

      # 6. 复制插件文件到构建目录（plugin_name 经 env 传入，禁止直接内插进 run）
      #
      # ⚠️ 这里的 cp 白名单即**发布包内容的唯一来源**（第 7.1 步会逐条断言）。
      #    故一律不加 `|| true`：少拷一个必需文件必须当场失败，而不是产出一个
      #    「缺文件却发布成功」的包，让使用者装上才发现 import 报错。
      - name: 复制插件文件
        env:
          PLUGIN_NAME: ${{ steps.get_info.outputs.plugin_name }}
        run: |
          # 插件必需文件（缺失即失败）
          cp main.py metadata.yaml _conf_schema.json "$PLUGIN_NAME/"
          # 依赖清单放到插件根：AstrBot 按插件根 requirements.txt 安装依赖
          cp src/requirements.txt "$PLUGIN_NAME/"
          # 源码包与消息模板（模板缺了插件运行时不渲染任何消息，属必需）
          cp -r src "$PLUGIN_NAME/"
          cp -r templates "$PLUGIN_NAME/"
          # 插件图标（可选，缺失不影响运行）
          cp logo.png "$PLUGIN_NAME/" || true

      # 7. 打包为 zip 文件（plugin_name 经 env 传入，禁止直接内插进 run）
      - name: 创建 zip 包
        env:
          PLUGIN_NAME: ${{ steps.get_info.outputs.plugin_name }}
        run: |
          # `-FS`：刷新模式，同名 zip 已存在时按内容同步增删。CI 是一次性工作区，
          # 加它纯粹为了「本地复跑同一脚本也不会残留旧条目」——否则删掉的文件会
          # 留在旧包（无论是本地，还是自托管 runner 复用工作目录的场景）。
          zip -r -FS "${PLUGIN_NAME}.zip" "$PLUGIN_NAME/" -x '*__pycache__*' '*.pyc'
          echo "== 发布包内容 =="
          unzip -l "${PLUGIN_NAME}.zip"

      # 7.1 校验发布包边界：只允许白名单条目，必需文件不得缺失
      - name: 校验发布包边界
        env:
          PLUGIN_NAME: ${{ steps.get_info.outputs.plugin_name }}
        run: |
          set -uo pipefail
          ARTIFACT="${PLUGIN_NAME}.zip"
          # awk 取第 4 列文件名；去掉目录行与表头 / 分隔行，再滤掉空行，
          # 否则首尾空行会让逐行断言失去意义
          LIST=$(unzip -l "$ARTIFACT" | awk '{print $4}' | grep -v '/$' \
            | grep -vE '^(Name|-+)?$' || true)

          # 1) 必需文件必须在包内
          for required in main.py metadata.yaml _conf_schema.json requirements.txt; do
            echo "$LIST" | grep -qx "${PLUGIN_NAME}/$required" \
              || { echo "::error::发布包缺少必需文件: $required"; exit 1; }
          done

          # 2) src/ 源码包必须在包内（main.py 靠它才能真正跑起来）
          echo "$LIST" | grep -q "^${PLUGIN_NAME}/src/" \
            || { echo "::error::发布包缺少 src/ 源码包"; exit 1; }
          echo "$LIST" | grep -q "^${PLUGIN_NAME}/templates/" \
            || { echo "::error::发布包缺少 templates/ 消息模板"; exit 1; }

          # 3) 包内只能出现白名单条目：开发 / CI 资产（AGENTS.md、install_gpg_keys.sh、
          #    ai-audit/、scripts/、.github/、tests/、docs/ 等）一旦混进包，
          #    会被铺到使用者的插件目录里，其中拉取私钥、改写全局 git 配置的脚本
          #    若被误执行，风险由使用者承担。
          while IFS= read -r entry; do
            case "$entry" in
              "${PLUGIN_NAME}/main.py"|"${PLUGIN_NAME}/metadata.yaml"| \
              "${PLUGIN_NAME}/_conf_schema.json"|"${PLUGIN_NAME}/requirements.txt"| \
              "${PLUGIN_NAME}/logo.png")
                continue
                ;;
              "${PLUGIN_NAME}/src/"*|"${PLUGIN_NAME}/templates/"*)
                continue
                ;;
            esac
            echo "::error::发布包内混入了白名单之外的条目: ${entry}"
            exit 1
          done <<< "$LIST"

          echo "发布包边界校验通过"

      # 8. 生成 Release Notes
      - name: 生成 Release Notes
        id: release_notes
        env:
          # version 经 env 传入，禁止直接内插进 run 脚本
          VERSION: ${{ steps.get_info.outputs.version }}
        run: |
          # 从上一个标签生成发布说明
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          # 定义生成更新日志的函数
          generate_changelog_from_git() {
            local PREVIOUS_TAG=$1
            local VERSION=$2

            # 初始化分类
            local FEAT=""
            local FIX=""
            local REFACTOR=""
            local DOCS=""
            local TEST=""
            local STYLE=""
            local CHORE=""
            local PERF=""
            local CI=""
            local BUILD=""
            local OTHER=""

            # 遍历所有 commit
            while IFS= read -r commit; do
              # 提取 commit 类型和消息
              type=$(echo "$commit" | sed -n 's/^\([a-z]*\):.*/\1/p')
              msg=$(echo "$commit" | sed 's/^[a-z]*: *//')

              # 按类型分类
              case "$type" in
                feat)    FEAT="${FEAT}- ${msg}\n" ;;
                fix)     FIX="${FIX}- ${msg}\n" ;;
                refactor) REFACTOR="${REFACTOR}- ${msg}\n" ;;
                docs)    DOCS="${DOCS}- ${msg}\n" ;;
                test)    TEST="${TEST}- ${msg}\n" ;;
                style)   STYLE="${STYLE}- ${msg}\n" ;;
                chore)   CHORE="${CHORE}- ${msg}\n" ;;
                perf)    PERF="${PERF}- ${msg}\n" ;;
                ci)      CI="${CI}- ${msg}\n" ;;
                build)   BUILD="${BUILD}- ${msg}\n" ;;
                *)       OTHER="${OTHER}- ${msg}\n" ;;
              esac
            done < <(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"%s" --no-merges)

            # 构建更新日志
            NOTES="## 📦 Release v${VERSION}\n\n"

            # 添加各个分类
            if [ -n "$FEAT" ]; then
              NOTES="${NOTES}### ✨ 新功能\n\n${FEAT}\n"
            fi

            if [ -n "$FIX" ]; then
              NOTES="${NOTES}### 🐛 修复\n\n${FIX}\n"
            fi

            if [ -n "$PERF" ]; then
              NOTES="${NOTES}### ⚡ 性能优化\n\n${PERF}\n"
            fi

            if [ -n "$REFACTOR" ]; then
              NOTES="${NOTES}### ♻️ 重构\n\n${REFACTOR}\n"
            fi

            if [ -n "$DOCS" ]; then
              NOTES="${NOTES}### 📝 文档\n\n${DOCS}\n"
            fi

            if [ -n "$TEST" ]; then
              NOTES="${NOTES}### ✅ 测试\n\n${TEST}\n"
            fi

            if [ -n "$STYLE" ]; then
              NOTES="${NOTES}### 💄 样式\n\n${STYLE}\n"
            fi

            if [ -n "$CI" ]; then
              NOTES="${NOTES}### 👷 CI\n\n${CI}\n"
            fi

            if [ -n "$BUILD" ]; then
              NOTES="${NOTES}### 📦 构建\n\n${BUILD}\n"
            fi

            if [ -n "$CHORE" ]; then
              NOTES="${NOTES}### 🔧 杂项\n\n${CHORE}\n"
            fi

            if [ -n "$OTHER" ]; then
              NOTES="${NOTES}### 其他\n\n${OTHER}\n"
            fi

            # 如果没有任何提交
            if [ "$NOTES" = "## 📦 Release v${VERSION}\n\n" ]; then
              NOTES="${NOTES}无更新内容\n"
            fi

            echo -e "$NOTES"
          }

          if [ -z "$PREVIOUS_TAG" ]; then
            # 首次 Release
            NOTES="## 🎉 首次 Release v${VERSION}\n\n这是 GitPulse（GitHub 事件转发插件）的首次正式 Release。\n\n### 功能特性\n\n- 接收 GitHub Webhook（push / issues / pull_request 等事件）\n- 验签校验 + 频率限制，避免重放与刷屏\n- 事件渲染为可配置的消息模板后转发到聊天平台\n- 可选 LLM 摘要，把长变更压成一句话\n\n### 使用方法\n\n请参考项目 README.md 了解详细使用方法。"
          else
            # 检查是否存在 CHANGELOG.md
            if [ -f "CHANGELOG.md" ]; then
              # 从 CHANGELOG.md 提取当前版本的更新内容
              CHANGELOG_CONTENT=$(awk -v version="\\[${VERSION}\\]" '$0 ~ version {found=1} found {print} found && /^## / && !($0 ~ version) {exit}' CHANGELOG.md | tail -n +2)

              if [ -n "$CHANGELOG_CONTENT" ]; then
                NOTES="## 📦 Release v${VERSION}\n\n${CHANGELOG_CONTENT}"
              else
                # CHANGELOG 中没有找到当前版本，从 git log 生成
                NOTES=$(generate_changelog_from_git "$PREVIOUS_TAG" "$VERSION")
              fi
            else
              # 从 git log 生成更新日志
              NOTES=$(generate_changelog_from_git "$PREVIOUS_TAG" "$VERSION")
            fi
          fi

          # 添加 Release Notes
          RELEASE_FOOTER="\n\n---\n\n### 📥 安装方法\n\n\`\`\`bash\n# 下载插件包后，将其放入 AstrBot 的 plugins 目录\n# 然后重启 AstrBot 服务\n"

          NOTES="${NOTES}${RELEASE_FOOTER}"

          # 保存到文件
          echo -e "$NOTES" > release_notes.md

          # 输出到环境变量
          {
            echo 'notes<<EOF'
            cat release_notes.md
            echo EOF
          } >> $GITHUB_OUTPUT

      # 9. 生成证据包（ci-evidence-pack）
      #
      # 引用方式：钉到 commit SHA 而不是 @main。浮动引用会让「本次跑的到底是哪一版」
      # 永远说不清，出了事故也无法回放；@main 还会让上游任何一次提交直接进入本作业
      # （本作业持有 contents: write + id-token: write）。
      #
      # 契约要点（改之前先读上游 action.yml）：
      #   1) include 必填，留空会让打包脚本直接失败，而不是产出一个空包；
      #   2) 输出目录 ≠ 上传目录：签名产物路径只能从 steps.evidence.outputs.* 取，
      #      手拼文件名会在上游改名时静默缺件；
      #   3) 签名产物是 cosign v3 的 .sigstore.json 单文件，.sig + .crt 双文件形态已废弃。
      - name: 生成证据包
        id: evidence
        if: steps.get_info.outputs.tag_exists != 'true'
        uses: xiaomizhoubaobei/ci-evidence-pack@53216365066a9fe64de178ab0184539ad253e355 # v0.0.2
        with:
          # 收集范围：插件 zip 产物 + 发布正文 + 构建输入清单。
          # 只列必需项，不整目录收录（否则 .git 与本地缓存会一起进包）。
          include: |
            ${{ steps.get_info.outputs.plugin_name }}.zip
            release_notes.md
            metadata.yaml
            _conf_schema.json
            src/requirements.txt
          out-dir: _evidence_dist
          sbom: auto
          # 包外锚点：sha256 登记到包外台账，随 Release 一起分发供下游核对。
          anchor-file: _anchor/anchor.txt
          expect-repo: ${{ github.repository }}
          # 自检不通过即红：发出一份自己都不信的包，比不发更糟。
          fail-on-invalid: true

      # 10. 创建 GitHub Release
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          tag_name: ${{ steps.get_info.outputs.tag_name }}
          name: Release ${{ steps.get_info.outputs.version }}
          body: |
            ${{ steps.release_notes.outputs.notes }}

            ---

            ## 📦 证据包说明

            本 Release 包含以下文件：

            - **${{ steps.get_info.outputs.plugin_name }}.zip**: 插件安装包
            - **evidence-\*.tar.gz**: CI 证据包（确定性打包 + 严格 manifest + SBOM）
            - **evidence-\*.tar.gz.sigstore.json**: cosign v3 签名 bundle（keyless，OIDC 短期证书）
            - **anchor.txt**: 证据包的包外 sha256 台账

            证据包 sha256：`${{ steps.evidence.outputs.bundle-sha256 }}`

            验签时请用 `--certificate-identity` 做**全等**匹配，核对身份为
            `https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/heads/main`：

            ```bash
            cosign verify-blob \
              --bundle evidence-*.tar.gz.sigstore.json \
              --certificate-identity 'https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/heads/main' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              evidence-*.tar.gz
            ```
          draft: false
          prerelease: false
          files: |
            ${{ steps.get_info.outputs.plugin_name }}.zip
            ${{ steps.evidence.outputs.bundle-path }}
            ${{ steps.evidence.outputs.signature-bundle }}
            ${{ steps.evidence.outputs.anchor-file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
