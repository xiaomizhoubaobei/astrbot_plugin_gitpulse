name: 'Release 构建'

# 触发条件：推送到 main 分支时触发或手动触发
on:
  push:
    branches:
      - main
    paths:
      - '**/*.py'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  build:
    name: 构建 Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # 为签名所必需
      actions: read

    steps:
      # 0. 安全加固
      - name: 加固运行器
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # 1. 检出代码
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # 获取完整的 git 历史

      # 2. 设置 Python 环境
      - name: 设置 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # 3. 获取版本号和插件名称（严格白名单校验，杜绝命令注入）
      - name: 获取版本号和插件名称
        id: get_info
        env:
          # metadata.yaml 随 PR 提交，属不可信输入；此处只做提取，随后立即用白名单校验。
          META_FILE: metadata.yaml
        run: |
          set -euo pipefail

          # 从 metadata.yaml 读取版本号（仅取 key 后的第一个字段，剥离行尾注释/空白）
          VERSION=$(grep -E "^version:[[:space:]]*" "$META_FILE" | head -n 1 | sed -E 's/^version:[[:space:]]*//; s/[[:space:]]+.*$//')
          # 移除可能存在的 'v' 前缀以避免重复
          VERSION=${VERSION#v}

          # 从 metadata.yaml 读取插件名称（同上处理）
          PLUGIN_NAME=$(grep -E "^name:[[:space:]]*" "$META_FILE" | head -n 1 | sed -E 's/^name:[[:space:]]*//; s/[[:space:]]+.*$//')

          # ── 白名单严格校验 ──────────────────────────────────────────────
          # 这两个值后续会用于 mkdir / zip / Release 资源名等位置；metadata.yaml
          # 属于不可信输入，任何 shell 元字符（$ ` ; | & ( ) 空格 换行等）都
          # 必须在源头拒绝，否则会在 contents: write 的发布作业中造成命令注入。
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::metadata.yaml 中的 version 非法（仅允许 SemVer，例如 1.2.3）：'${VERSION}'"
            exit 1
          fi
          if ! printf '%s' "$PLUGIN_NAME" | grep -Eq '^[A-Za-z0-9._-]{1,64}$'; then
            echo "::error::metadata.yaml 中的 name 非法（仅允许字母/数字/._-，且不超过 64 字符）：'${PLUGIN_NAME}'"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "plugin_name=$PLUGIN_NAME" >> "$GITHUB_OUTPUT"

      # 4. 安装依赖
      - name: 安装依赖
        run: |
          # 本仓库依赖清单位于 src/requirements.txt（插件生态依赖由 AstrBot 宿主提供）
          if [ -f src/requirements.txt ] && [ -s src/requirements.txt ]; then
            pip install -r src/requirements.txt
          else
            echo "src/requirements.txt 不存在或为空，跳过依赖安装"
          fi

      # 5. 创建插件目录（plugin_name 经 env 传入，禁止直接内插进 run）
      - name: 创建插件目录
        env:
          PLUGIN_NAME: ${{ steps.get_info.outputs.plugin_name }}
        run: |
          mkdir -p "$PLUGIN_NAME"

      # 6. 复制插件文件到构建目录（plugin_name 经 env 传入，禁止直接内插进 run）
      - name: 复制插件文件
        env:
          PLUGIN_NAME: ${{ steps.get_info.outputs.plugin_name }}
        run: |
          # 复制主程序文件
          cp main.py "$PLUGIN_NAME/" || true
          # 复制配置文件和元数据
          cp metadata.yaml _conf_schema.json "$PLUGIN_NAME/" || true
          # 复制依赖清单到插件根（AstrBot 按插件根 requirements.txt 安装依赖）
          cp src/requirements.txt "$PLUGIN_NAME/" || true
          # 复制源码包与模板
          cp -r src "$PLUGIN_NAME/" || true
          cp -r templates "$PLUGIN_NAME/" || true

      # 7. 打包为 zip 文件（plugin_name 经 env 传入，禁止直接内插进 run）
      - name: 创建 zip 包
        env:
          PLUGIN_NAME: ${{ steps.get_info.outputs.plugin_name }}
        run: |
          zip -r "${PLUGIN_NAME}.zip" "$PLUGIN_NAME/"

      # 8. 生成 Release Notes
      - name: 生成 Release Notes
        id: release_notes
        env:
          # version 经 env 传入，禁止直接内插进 run 脚本
          VERSION: ${{ steps.get_info.outputs.version }}
        run: |
          # 从上一个标签生成发布说明
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          # 定义生成更新日志的函数
          generate_changelog_from_git() {
            local PREVIOUS_TAG=$1
            local VERSION=$2

            # 初始化分类
            local FEAT=""
            local FIX=""
            local REFACTOR=""
            local DOCS=""
            local TEST=""
            local STYLE=""
            local CHORE=""
            local PERF=""
            local CI=""
            local BUILD=""
            local OTHER=""

            # 遍历所有 commit
            while IFS= read -r commit; do
              # 提取 commit 类型和消息
              type=$(echo "$commit" | sed -n 's/^\([a-z]*\):.*/\1/p')
              msg=$(echo "$commit" | sed 's/^[a-z]*: *//')

              # 按类型分类
              case "$type" in
                feat)    FEAT="${FEAT}- ${msg}\n" ;;
                fix)     FIX="${FIX}- ${msg}\n" ;;
                refactor) REFACTOR="${REFACTOR}- ${msg}\n" ;;
                docs)    DOCS="${DOCS}- ${msg}\n" ;;
                test)    TEST="${TEST}- ${msg}\n" ;;
                style)   STYLE="${STYLE}- ${msg}\n" ;;
                chore)   CHORE="${CHORE}- ${msg}\n" ;;
                perf)    PERF="${PERF}- ${msg}\n" ;;
                ci)      CI="${CI}- ${msg}\n" ;;
                build)   BUILD="${BUILD}- ${msg}\n" ;;
                *)       OTHER="${OTHER}- ${msg}\n" ;;
              esac
            done < <(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"%s" --no-merges)

            # 构建更新日志
            NOTES="## 📦 Release v${VERSION}\n\n"

            # 添加各个分类
            if [ -n "$FEAT" ]; then
              NOTES="${NOTES}### ✨ 新功能\n\n${FEAT}\n"
            fi

            if [ -n "$FIX" ]; then
              NOTES="${NOTES}### 🐛 修复\n\n${FIX}\n"
            fi

            if [ -n "$PERF" ]; then
              NOTES="${NOTES}### ⚡ 性能优化\n\n${PERF}\n"
            fi

            if [ -n "$REFACTOR" ]; then
              NOTES="${NOTES}### ♻️ 重构\n\n${REFACTOR}\n"
            fi

            if [ -n "$DOCS" ]; then
              NOTES="${NOTES}### 📝 文档\n\n${DOCS}\n"
            fi

            if [ -n "$TEST" ]; then
              NOTES="${NOTES}### ✅ 测试\n\n${TEST}\n"
            fi

            if [ -n "$STYLE" ]; then
              NOTES="${NOTES}### 💄 样式\n\n${STYLE}\n"
            fi

            if [ -n "$CI" ]; then
              NOTES="${NOTES}### 👷 CI\n\n${CI}\n"
            fi

            if [ -n "$BUILD" ]; then
              NOTES="${NOTES}### 📦 构建\n\n${BUILD}\n"
            fi

            if [ -n "$CHORE" ]; then
              NOTES="${NOTES}### 🔧 杂项\n\n${CHORE}\n"
            fi

            if [ -n "$OTHER" ]; then
              NOTES="${NOTES}### 其他\n\n${OTHER}\n"
            fi

            # 如果没有任何提交
            if [ "$NOTES" = "## 📦 Release v${VERSION}\n\n" ]; then
              NOTES="${NOTES}无更新内容\n"
            fi

            echo -e "$NOTES"
          }

          if [ -z "$PREVIOUS_TAG" ]; then
            # 首次 Release
            NOTES="## 🎉 首次 Release v${VERSION}\n\n这是 AstrBot AI 模型插件的首次正式 Release。\n\n### 功能特性\n\n- 支持多家模型服务提供商的图片生成功能\n- 通过自然语言让 LLM 生成内容\n- 让 bot 自拍给你看\n\n### 使用方法\n\n请参考项目 README.md 了解详细使用方法。"
          else
            # 检查是否存在 CHANGELOG.md
            if [ -f "CHANGELOG.md" ]; then
              # 从 CHANGELOG.md 提取当前版本的更新内容
              CHANGELOG_CONTENT=$(awk -v version="\\[${VERSION}\\]" '$0 ~ version {found=1} found {print} found && /^## / && !($0 ~ version) {exit}' CHANGELOG.md | tail -n +2)

              if [ -n "$CHANGELOG_CONTENT" ]; then
                NOTES="## 📦 Release v${VERSION}\n\n${CHANGELOG_CONTENT}"
              else
                # CHANGELOG 中没有找到当前版本，从 git log 生成
                NOTES=$(generate_changelog_from_git "$PREVIOUS_TAG" "$VERSION")
              fi
            else
              # 从 git log 生成更新日志
              NOTES=$(generate_changelog_from_git "$PREVIOUS_TAG" "$VERSION")
            fi
          fi

          # 添加 Release Notes
          RELEASE_FOOTER="\n\n---\n\n### 📥 安装方法\n\n\`\`\`bash\n# 下载插件包后，将其放入 AstrBot 的 plugins 目录\n# 然后重启 AstrBot 服务\n"

          NOTES="${NOTES}${RELEASE_FOOTER}"

          # 保存到文件
          echo -e "$NOTES" > release_notes.md

          # 输出到环境变量
          {
            echo 'notes<<EOF'
            cat release_notes.md
            echo EOF
          } >> $GITHUB_OUTPUT

      # 9. 生成证据包
      - name: 生成证据包
        if: always()  # 即使构建失败也运行
        uses: OrygnsCode/ci-evidence-pack@8222d7b3b015ce2f72222215bdf9966773036ab1 # main
        with:
          sign: 'true'

      # 10. 创建 GitHub Release
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.get_info.outputs.tag_name }}
          name: Release ${{ steps.get_info.outputs.version }}
          body: |
            ${{ steps.release_notes.outputs.notes }}

            ---

            ## 📦 证据包说明

            本 Release 包含以下文件：

            - **${{ steps.get_info.outputs.plugin_name }}.zip**: 插件安装包
            - **evidence-bundle.tar.gz**: CI 证据包（包含源代码、Git 元数据、依赖项、SBOM 等）
            - **evidence-bundle.tar.gz.sig**: 证据包的 Sigstore 签名
            - **evidence-bundle.tar.gz.crt**: 证据包的签名证书

            证据包用于合规性审计和构建验证，可以使用以下命令验证：

            ```bash
            ci-evidence-pack verify evidence-bundle.tar.gz
            ```
          draft: false
          prerelease: false
          files: |
            ${{ steps.get_info.outputs.plugin_name }}.zip
            _evidence_dist/*.tar.gz
            _evidence_dist/*.sig
            _evidence_dist/*.crt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
