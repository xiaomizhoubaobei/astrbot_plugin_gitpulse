$:
    vscode:
        - docker:
            image: docker.cnb.cool/xmzzuzhi/cnb-docker/python:0.0.1
          imports:
            - https://cnb.cool/XMZZUZHI/key/-/blob/main/Claude.yml
          runner:
            cpus: 32
          services:
            - vscode
            - docker
          stages:
              - name: 授予install_gpg_keys.sh权限
                script:
                    - chmod +x /workspace/install_gpg_keys.sh
              - name: 安装claude CLI
                script:
                    - npm install -g @anthropic-ai/claude-code
                    - echo "claude CLI安装完成"
              - name: 安装qwen CLI
                script:
                    - npm install -g @qwen-code/qwen-code@latest
                    - echo "qwen CLI安装完成"
              - name: 安装CodeBuddy CLI
                script:
                    - npm install -g @tencent-ai/codebuddy-code
                    - echo "CodeBuddy CLI安装完成"
              - name: 安装Qoder CLI
                script:
                  - curl -fsSL https://qoder.com/install | bash
                  - echo "Qoder CLI安装完成"
              - name: 安装sudo更新APT源
                script:
                    - sudo apt-get update
                    - sudo apt-get install -y lsof net-tools jq
                    - echo "依赖完成"
              - name: 安装Git LFS
                script:
                    - sudo apt-get install -y git-lfs
                    - git lfs install
                    - echo "Git LFS安装完成"
              - name: 创建codebuddy配置文件夹
                script:
                    - mkdir -p /root/.codebuddy
                    - curl -o /root/.codebuddy/models.json https://cnb-1329111128.cos.ap-guangzhou.myqcloud.com/codebuddy.json
                    - echo "已创建 root/.codebuddy 文件夹并下载 models.json"
              - name: 克隆Astrbot并重新克隆
                script:
                  - git clone https://github.com/AstrBotDevs/AstrBot.git /tmp/astrbot-tmp
                  - cp -r /tmp/astrbot-tmp/astrbot /workspace
                  - rm -rf /tmp/astrbot-tmp
                  - git clone https://github.com/AstrBotDevs/AstrBot.git

main:
      # 同步本仓库代码到 GitHub 镜像仓库（xiaomizhoubaobei/astrbot_plugin_gitpulse），
      # 并开启强制推送（force: true -> git push --force），确保 CNB 侧历史始终覆盖镜像仓库，
      # 即使两侧历史出现分叉（如镜像仓库被外部改动）也能同步成功，不留半同步状态。
      # 说明：Github.yml 密钥仓库提供 GIT_USERNAME / GIT_ACCESS_TOKEN / GIT_EMAIL。
      push:
        - services:
            - docker
          imports:
            - https://cnb.cool/XMZZUZHI/key/-/blob/main/Github.yml
          stages:
            - name: 同步到GitHub
              image: tencentcom/git-sync
              settings:
                target_url: https://github.com/xiaomizhoubaobei/astrbot_plugin_gitpulse.git
                auth_type: https
                username: ${GIT_USERNAME}
                password: ${GIT_ACCESS_TOKEN}
                branch: main
                force: true
                git_user: ${GIT_USERNAME}
                git_email: ${GIT_EMAIL}

      # PR 门禁：CNB 是实际合并入口，GitHub 镜像 PR 的 CI 无法阻止 CNB 合并，
      # 故在 PR 阶段补齐最小门禁——只运行单元测试，代码规范交由 pre-commit 钩子
      # 与 GitHub Actions 负责，避免 CNB 侧重复安装钩子环境拖慢 PR 反馈。
      # 不引入密钥仓库 imports：PR 会执行不可信代码，本 job 不接触任何长期令牌；
      # 覆盖率与安全扫描仍由 GitHub Actions 负责（AGENTS.md §10.8.2 / §10.8.3）。
      pull_request:
        unit-test:
          name: 单元测试
          # 同一 PR 的旧运行自动取消，避免重复占用 runner
          lock:
            key: pr-test-$CNB_PULL_REQUEST_IID
            cancel-in-progress: true
          # 使用 python 镜像执行脚本，按 AGENTS.md §4.2 声明 docker 服务
          services:
            - docker
          stages:
            - name: 运行单元测试
              image: docker.cnb.cool/xmzzuzhi/cnb-docker/python:0.0.1
              script:
                - python -m pip install -U pip
                - pip install -r requirements-dev.txt
                - python -m pytest tests -q

        # PR Lens：把 PR 的 diff 画成架构图 / 数据流图 / 数据模型图（SVG），并在 PR
        # 中维护一条可更新的评论。默认使用 CNB 内置模型与流水线临时令牌（CNB_TOKEN），
        # 不需要额外密钥仓库；diff 只会发送给该模型服务，图片发布到孤儿分支 pr-lens。
        # 插件源码与脚本在 XMZZUZHI/Github/pr-lens，本仓库只引用已发布镜像；
        # 镜像固定到 0.0.3（digest sha256:370c2fd3…），避免 latest 漂移。
        pr-lens:
          name: PR Lens
          # 同一 PR 的新提交会取消旧运行，避免重复消耗模型额度；
          # 插件写入前也会校验 head SHA，不会覆盖更新提交对应的图。
          lock:
            key: pr-lens-$CNB_PULL_REQUEST_IID
            cancel-in-progress: true
          # 按 AGENTS.md §4.2 声明 docker 服务
          services:
            - docker
          stages:
            - name: 生成架构图并更新评论
              # 可视化属增强能力：模型偶发输出不符合 schema（INVALID_DOCUMENT）时
              # 不应阻断合并；单元测试仍是 PR 的强制门禁。
              allowFailure: true
              image: docker.cnb.cool/xmzzuzhi/github/pr-lens/pr-lens:0.0.3
